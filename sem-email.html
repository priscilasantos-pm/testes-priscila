<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário de teste — só telefone</title>
<style>
  body {
    font-family: -apple-system, Arial, sans-serif;
    max-width: 480px;
    margin: 60px auto;
    padding: 0 20px;
    color: #1a1a1a;
  }
  h1 { font-size: 22px; }
  p.intro { color: #555; font-size: 14px; line-height: 1.5; }
  form { margin-top: 24px; display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 13px; font-weight: 600; }
  input {
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  small { color: #888; font-size: 12px; }
  button {
    margin-top: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    background: #00c8ea;
    color: #012233;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  #msg { color: #c8102e; font-size: 13px; }
</style>
</head>
<body>

<h1>Formulário de teste — sem e-mail</h1>
<p class="intro">Formulário só com telefone, sem nenhum campo de e-mail, pra testar a identificação do Lead exclusivamente pelo Telefone Principal em formato E.164.</p>

<form id="form-sem-email" name="form-sem-email">
  <div>
    <label for="nome">Nome</label><br>
    <input type="text" id="nome" name="nome" placeholder="Seu nome">
  </div>

  <div>
    <label for="phone">Telefone principal</label><br>
    <input type="tel" id="phone" name="phone" placeholder="+5511999998888" pattern="^\+[1-9]\d{6,14}$" required>
    <br><small>Formato E.164, ex: +5511999998888. Obrigatório — é o único identificador deste formulário.</small>
  </div>

  <button type="submit">Enviar</button>
  <p id="msg" role="status"></p>
</form>

<script>
  document.getElementById('form-sem-email').addEventListener('submit', function (e) {
    var phone = document.getElementById('phone').value.trim();
    var msg = document.getElementById('msg');

    if (!phone || !/^\+[1-9]\d{6,14}$/.test(phone)) {
      e.preventDefault();
      msg.textContent = 'Telefone obrigatório no padrão E.164. Ex: +5511999998888';
      return;
    }
    msg.textContent = '';
  });
</script>

</body>
</html>
